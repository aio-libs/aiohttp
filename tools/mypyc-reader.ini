# Hermetic mypy configuration for compiling aiohttp/_websocket/reader.py
# with mypyc at build time (see setup.py).  Lint configuration lives in
# .mypy.ini; this one must work in an isolated build environment:
#
# - runtime dependencies (multidict, yarl, ...) may be absent, so
#   unresolvable imports degrade to Any instead of failing the build;
# - followed aiohttp modules are analyzed for type information but their
#   diagnostics are suppressed (they are linted by .mypy.ini in CI, under
#   the pinned mypy and full dependency set).
[mypy]
follow_imports = silent
ignore_missing_imports = True
follow_untyped_imports = True

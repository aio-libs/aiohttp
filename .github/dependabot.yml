---

# Only `master` is tracked: Patchback carries version bumps into the
# release branches along with the backports.
# Security updates are not affected by `schedule`, `cooldown`, `groups`
# or `open-pull-requests-limit`, so vulnerable pins are still bumped
# as soon as an advisory is published.

version: 2
updates:
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: quarterly
  labels:
  - dependencies
  ignore:
  - dependency-name: '*'
    update-types:
    - version-update:semver-minor
    - version-update:semver-patch
  groups:
    actions:
      patterns:
      - '*'
  cooldown:
    # https://blog.yossarian.net/2025/11/21/We-should-all-be-using-dependency-cooldowns
    # Cooldowns protect against supply chain attacks by avoiding the
    # highest-risk window immediately after new releases.
    default-days: 14

- package-ecosystem: pip
  directory: /
  schedule:
    interval: quarterly
  labels:
  - dependencies
  versioning-strategy: increase-if-necessary
  allow:
  - dependency-type: all
  open-pull-requests-limit: 10
  cooldown:
    default-days: 14

- package-ecosystem: docker
  directory: /tests/autobahn/
  schedule:
    interval: quarterly
  labels:
  - dependencies
  cooldown:
    default-days: 14

...

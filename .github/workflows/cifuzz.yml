name: CIFuzz

on:
  push:
    branches:
      - 'master'
      - '[0-9].[0-9]+'  # matches to backport branches, e.g. 3.6
  pull_request:
    branches:
      - 'master'
      - '[0-9].[0-9]+'

permissions: {}

jobs:
  Fuzzing:
    name: Fuzzing (${{ matrix.sanitizer }})
    runs-on: ubuntu-latest
    permissions:
      contents: read  # For build_fuzzers to check out the code
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, undefined]
    outputs:
      address: ${{ steps.flag.outputs.address }}
      undefined: ${{ steps.flag.outputs.undefined }}
    steps:
      - name: Build Fuzzers
        id: build
        uses: google/oss-fuzz/infra/cifuzz/actions/build_fuzzers@master
        with:
          oss-fuzz-project-name: 'aiohttp'
          language: python
          sanitizer: ${{ matrix.sanitizer }}
      - name: Run Fuzzers
        uses: google/oss-fuzz/infra/cifuzz/actions/run_fuzzers@master
        with:
          oss-fuzz-project-name: 'aiohttp'
          language: python
          fuzz-seconds: 600
          sanitizer: ${{ matrix.sanitizer }}
      - name: Upload Crash
        uses: actions/upload-artifact@v4.6.2
        if: failure() && steps.build.outcome == 'success'
        with:
          name: ${{ matrix.sanitizer }}-artifacts
          path: ./out/artifacts
      - name: Flag fuzzer crash
        id: flag
        if: failure() && steps.build.outcome == 'success'
        env:
          SANITIZER: ${{ matrix.sanitizer }}
        run: echo "${SANITIZER}=crashed" >> "$GITHUB_OUTPUT"

  Report:
    name: Open issue on post-merge crash
    needs: Fuzzing
    if: failure() && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      issues: write  # To create a new issue for the crash
    steps:
      - name: Open issue
        uses: actions/github-script@v9.0.0
        env:
          CRASHES: ${{ toJSON(needs.Fuzzing.outputs) }}
        with:
          script: |
            const crashed = Object.entries(JSON.parse(process.env.CRASHES))
              .filter(([, value]) => value === 'crashed')
              .map(([sanitizer]) => sanitizer);
            const branch = context.ref.replace('refs/heads/', '');
            const shortSha = context.sha.substring(0, 7);
            const runUrl =
              `${context.serverUrl}/${context.repo.owner}` +
              `/${context.repo.repo}/actions/runs/${context.runId}`;
            for (const sanitizer of crashed) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `CIFuzz: ${sanitizer} crash on ${branch} @ ${shortSha}`,
                body: [
                  `CIFuzz found a crash on \`${branch}\` at ${context.sha}.`,
                  ``,
                  `- Sanitizer: \`${sanitizer}\``,
                  `- Run: ${runUrl}`,
                  `- Download \`${sanitizer}-artifacts\` from the run page for the reproducer.`,
                ].join('\n'),
                type: 'Bug',
              });
            }
